<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ぽかぽかタウン 素材プレビュー</title>
<style>
  :root { --ink: #1f1d1b; --bg: #eef6e4; --card: #fffdf6; }
  body { margin: 0; padding: 16px; background: var(--bg); color: var(--ink); font: 13px/1.5 "Hiragino Maru Gothic ProN", "M PLUS Rounded 1c", sans-serif; }
  h1 { font-size: 18px; margin: 0 0 8px; }
  h2 { font-size: 15px; margin: 22px 0 8px; border-bottom: 2px solid var(--ink); }
  .ctrl { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; background: var(--card); border: 2px solid var(--ink); border-radius: 12px; padding: 10px; position: sticky; top: 0; z-index: 2; }
  select, button { font: inherit; }
  .row { display: flex; flex-wrap: wrap; gap: 6px; align-items: flex-end; }
  .cell { background: var(--card); border: 1px solid #cfc6b3; border-radius: 8px; padding: 4px; text-align: center; font-size: 10px; }
  .cell svg { display: block; }
  .muted { color: #6b604f; }
</style>
</head>
<body>
<h1>ぽかぽかタウン 素材プレビュー</h1>
<p><a href="roads-preview.html">平和台 v0.2 の道路プレビュー（TOWN-01）</a></p>
<p class="muted">開発用のページ（ゲーム本編からは使わない）。服・NPC・敵・家具を足したら、ここで 3人×向き×ポーズ の見た目を確かめる。<br>
表示: <code>npm start</code> してから <code>http://localhost:8080/tools/preview.html</code></p>
<div class="ctrl" id="ctrl"></div>
<div id="out"></div>
<script src="../js/version.js"></script>
<script src="../js/chara-data.js"></script>
<script src="../js/util.js"></script>
<script src="../js/data.js"></script>
<script src="../js/chara.js"></script>
<script src="../js/puri-pose.js"></script>
<script src="../js/art.js"></script>
<script src="../js/npc-art.js"></script>
<script src="../js/home-catalog.js"></script>
<script src="../js/seasonal-catalog.js"></script>
<script src="../js/home-design.js"></script>
<script src="../js/furniture-models.js"></script>
<script src="../js/furniture-live.js"></script>
<script src="../js/puzzle-prizes.js"></script>
<script src="../js/shop-rewards.js"></script>
<script src="../js/shop-reward-art.js"></script>
<script src="../js/shop-reward-art-more.js"></script>
<script src="../js/tiles.js"></script>
<script src="../js/world-art.js"></script>
<script src="../js/world-scenery.js"></script>
<script src="../js/museum-art.js"></script>
<script src="../js/gun-art.js"></script>
<script src="../js/range.js"></script>
<script src="../js/town-renewal-art.js"></script>
<script src="../js/atlas-art.js"></script>
<script src="../js/parent-care.js"></script>
<script src="../js/parent-wardrobe.js"></script>
<script src="../js/annual-festivals.js"></script>
<script src="../js/seasonal.js"></script>
<script src="../js/weather.js"></script>
<script>
  const out = document.getElementById("out");
  const ctrl = document.getElementById("ctrl");
  const outfit = { head: null, face: null, neck: null, body: null, back: null };
  let pose = "idle_01", face = "normal", size = 110, color = "soft", gesture = "";
  const sel = (label, opts, value, onchange) => {
    const s = document.createElement("select");
    for (const [v, t] of opts) { const o = document.createElement("option"); o.value = v; o.textContent = t; if (v === value) o.selected = true; s.append(o); }
    s.onchange = () => { onchange(s.value); render(); };
    const l = document.createElement("label"); l.append(label + " ", s); ctrl.append(l);
  };
  for (const [slot, name] of Object.entries(SLOT_NAMES)) sel(name, [["", "なし"], ...WEAR_ITEMS.filter((w) => w.slot === slot).map((w) => [w.id, w.name])], "", (v) => (outfit[slot] = v || null));
  sel("ポーズ", ["idle_01", "idle_02", "walk_01", "walk_02", "jump_01", "land_01"].map((p) => [p, p]), pose, (v) => (pose = v));
  sel("うで（ぷりくら）", [["", "なし"], ...Object.keys(CHARA_GESTURES).map((g) => [g, g])], gesture, (v) => (gesture = v));
  sel("表情", [...Object.keys(Chara.EMO), ...new Set(Object.values(CHARA_FACE_EXTRA).flatMap((f) => Object.keys(f)))].map((e) => [e, e]), face, (v) => (face = v));
  sel("ごじの色", [["soft", "soft"], ["dark", "dark"]], color, (v) => (color = v));
  sel("大きさ", [["80", "小"], ["110", "中"], ["160", "大"]], "110", (v) => (size = +v));

  const cell = (svg, w, label) => `<div class="cell">${svg.replace("<svg ", `<svg width="${w}" `)}<div>${label}</div></div>`;
  const row = (items) => `<div class="row">${items.join("")}</div>`;
  function render() {
    if(new URLSearchParams(location.search).has("shop-rewards")){
      ctrl.hidden=true;
      out.innerHTML=Object.entries(ShopRewards.themes).map(([shop,t])=>'<h2>'+t.name+'</h2>'+row(ShopRewards.prizes.filter(p=>p.shop===shop).map(p=>'<div class="cell" style="width:220px">'+ShopRewardArt.model(p.id).full.replace('<svg ','<svg width="210" height="160" ')+ '<div>Lv.'+p.level+' '+p.name+'</div></div>'))).join('');
      return;
    }
    let h = '<h2>ぜんたい ちず（オリジナル地形）</h2><div style="max-width:800px">'+AtlasArt.svg()+'</div>';
    h += '<h2>12かげつのおまつり</h2>'+row(ANNUAL_EVENTS.map(e=>cell(AnnualArt.svg(e),96,e.month+'月 '+e.name)));
    h += '<h2>広いおうち・左右の壁と床</h2>'+row([['wp_cream','fl_wood'],['wp_sage_panel','fl_walnut'],['wp_blue_panel','fl_parquet']].map(([wall,floor])=>cell(HomeDesign.roomSvg(wall,floor),380,wall+' / '+floor)));
    h += '<h2>おへやの拡張（床面積2倍）</h2>'+row(Object.entries(HomeDesign.sizes).map(([name,size])=>cell(HomeDesign.roomSvg('wp_cream','fl_wood',size),380,`${name} ${size.w}×${size.d}`)));
    h += '<h2>風と落ち葉</h2>'+row([.1,.3,.6,.9].map(seed=>{const c=document.createElement('canvas');c.width=80;c.height=80;const ctx=c.getContext('2d');ctx.translate(40,40);ctx.scale(3,3);Seasonal.leaf(ctx,{x:0,y:0,seed,angle:.3,fold:1},true);return cell('<img alt="葉脈のある落ち葉" src="'+c.toDataURL()+'">',80,'あきの はっぱ');}));
    h += '<h2>天気と四季の木</h2>'+row(Object.keys(Weather.kinds).map(k=>cell(Weather.svg(k),64,Weather.kinds[k].name)))+row(Object.keys(SeasonPalette.values).flatMap(season=>['tree','pine','bush'].map(k=>cell(SeasonPalette.object(k,Art.worldSvg(k),season).full,70,season+' '+k))));
    h += '<h2>ぱぱ・まま（ふく・かお・動き）</h2>'+row(["papa","mama"].flatMap(id=>ParentCare.options.outfit.flatMap(([outfit])=>ParentCare.options.face.map(([face],i)=>cell(ParentCare.svg(id,{outfit,face,color:["blue","pink","mint","yellow","purple"][i],hair:id==="papa"?"short":"bob",accessory:id==="papa"?"glasses":"flower",skin:"light"},["idle","walk1","walk2","care","wave"][i]),100,id+' '+outfit+' '+face)))));
    h += "<h2>3人 × 向き（上の選択を反映）</h2>";
    h += row(Chara.IDS.flatMap((id) => ["down", "left", "right", "up"].map((dir) => cell(Chara.svg(id, { dir, pose, face, outfit, color, gesture }), size, `${id} ${dir}`))));
    h += "<h2>ぷりくらの うでの ポーズ（まえむき・上の 服を 反映）と かおの ボタン 8つ</h2>";
    h += row(Chara.IDS.flatMap((id) => Object.keys(CHARA_GESTURES).map((g) => cell(Chara.svg(id, { pose, face: PuriPose.faceOf(id, "happy"), outfit, color, gesture: g }), size, `${id} ${g}`))));
    h += row(Chara.IDS.flatMap((id) => ["happy", "excited", "love", "surprise", "angry", "sad", "sleep", "normal"].map((f) => cell(Chara.svg(id, { face: PuriPose.faceOf(id, f), outfit, color }), 72, `${id} ${f}`))));
    h += "<h2>服をひとつずつ（3人・正面／後ろ）</h2>";
    for (const slot of Object.keys(SLOT_NAMES)) {
      h += `<div class="muted">${SLOT_NAMES[slot]}</div>`;
      h += row(WEAR_ITEMS.filter((w) => w.slot === slot).flatMap((w) => Chara.IDS.map((id) => cell(Chara.svg(id, { outfit: { [w.slot]: w.id }, dir: slot === "back" ? "up" : "down", color }), 64, `${w.name}<br>${id}`))));
    }
    h += "<h2>アイコン（服）</h2>" + row(WEAR_ITEMS.map((w) => cell(Art.iconSvg("wear", w.id), 48, w.id)));
    h += "<h2>町の人（どうぶつ）</h2>" + row(Object.keys(SPECIES).flatMap((sp) => ["normal", "happy", "sad", "surprise"].map((emo) => cell(Art.npcSvg({ sp, emo }), 80, `${sp} ${emo}`))));
    h += "<h2>町の人の 顔の ぶひん（NpcArt）</h2>" + row([...NpcArt.EYE.map((eye) => cell(Art.npcSvg({ sp: "dog", look: { eye } }), 80, "eye " + eye)), ...NpcArt.PATTERN.map((pattern) => cell(Art.npcSvg({ sp: "cat", look: { pattern } }), 80, "pattern " + pattern)), ...NpcArt.TUFT.map((tuft) => cell(Art.npcSvg({ sp: "bear", look: { tuft } }), 80, "tuft " + tuft))]);
    h += "<h2>てき</h2>" + row(Object.entries(ENEMIES).flatMap(([k, e]) => ["normal", "hurt", "sleep"].map((emo) => cell(Art.enemySvg(e.art, e.col, emo), 86, `${e.name} ${emo}`))));
    h += "<h2>かぐ</h2>" + row(FURNITURE.map((f) => cell(Art.furnSvg(f.id), Math.round((f.w + 24) * 1.2), `${f.name}<br>${f.kind} ${f.w}×${f.h}`)));
    h += "<h2>追加した敵の姿</h2>" + row(Object.keys(ENEMY_ART).filter(id => !Object.values(ENEMIES).some(e => e.art === id)).flatMap(id => ["normal", "hurt", "sleep"].map(emo => cell(Art.enemySvg(id, "#AACBC2", emo), 86, `${id} ${emo}`))));
    h += "<h2>たべもの・どうぐ・かべがみ・ゆか</h2>" + row([...FOODS, ...TOOLS].map((f) => cell(Art.iconSvg("bag", f.id), 44, f.name)).concat(WALLPAPERS.map((w) => cell(Art.iconSvg("wall", w.id), 44, w.name)), FLOORS.map((w) => cell(Art.iconSvg("floor", w.id), 44, w.name))));
    h += "<h2>まちのオブジェクト</h2>" + row(["fountain","windmill","waterwheel","swing","clocktower","signal","lighthouse","railway","flowercart","crane","sailboat","floatplane","telescope","windsock","controltower","parasol","glowstone","minecart"].map(k=>cell(Art.worldSvg(k).full,96,k)));
    h += "<h2>町ごとの建物</h2>"+row(TownRenewalArt.styles.map(style=>cell(Art.worldSvg("building",{style,w:6,h:4,door:2}).full,176,style)));
    h += "<h2>街区の小物</h2>"+row(TownRenewalArt.props.map(k=>cell(Art.worldSvg(k).full,72,k)));
    out.innerHTML = h;
  }
  render();
</script>
</body>
</html>
