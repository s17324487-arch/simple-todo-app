<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>平和台 v0.2 — 道の検証（TOWN-01）</title>
<style>
body{margin:0;padding:20px;background:#fbf8f1;color:#302c28;font:16px/1.5 sans-serif}h1{font-size:22px}button,select{font:inherit;min-height:44px;margin:4px}#output{display:flex;gap:20px;flex-wrap:wrap}figure{margin:10px 0}figcaption{max-width:390px}img{display:block;border:1px solid #777;max-width:100%;height:auto}iframe{position:fixed;left:-1000px;width:390px;height:844px;border:0}
</style>
<h1>平和台 v0.2 — 道の検証（TOWN-01）</h1>
<p>見本①②と同じ座標・縮尺の道路です。建物・小物・町の配置は後続PRで移植します。セーブや本編の平和台は変更しません。</p>
<label>画面 <select id="size"><option value="390,844">390×844</option><option value="375,667">375×667</option></select></label>
<button id="show" disabled>画像を更新</button>
<p id="status">読み込み中…</p><div id="output"></div>
<p><a href="../docs/design/towns/heiwadai/img/phones.png">見本 phones.png（①〜⑤）</a> · <a href="preview.html">素材一覧</a></p>
<iframe id="game" src="../index.html" title="道路描画用のゲーム"></iframe>
<script src="../tests/fixtures/roads-v02.js"></script>
<script>
const iframe=document.querySelector('#game'),button=document.querySelector('#show');
async function render(){
  button.disabled=true;
  try{
    const [width,height]=document.querySelector('#size').value.split(',').map(Number),out=document.querySelector('#output');out.replaceChildren();
    for(const [label,cx,cy] of [['① 駅前ロータリー・駅前通り',43.2,27.4],['② T字路・円弧・45度の道路',43,45]]){
      const r=await iframe.contentWindow.PokaDebug.roadPreview(ROAD_FIXTURE,{cx,cy,width,height}),figure=document.createElement('figure'),caption=document.createElement('figcaption'),img=document.createElement('img');
      caption.textContent=label+' — '+width+'×'+height;img.src=r.url;img.width=width;img.height=height;img.alt=caption.textContent;figure.append(caption,img);out.append(figure);
    }
    document.querySelector('#status').textContent='道路のみの実装を表示しています。';
  }catch(e){document.querySelector('#status').textContent=e.message;}
  finally{button.disabled=false;}
}
iframe.addEventListener('load',()=>{button.disabled=false;render();});button.onclick=render;
</script>
</html>
