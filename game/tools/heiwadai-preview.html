<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>平和台・見本SVGの移植確認</title>
<style>body{margin:20px;background:#fbf8f1;color:#3c352e;font:15px/1.6 sans-serif}main{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px}figure{margin:0;border:1px solid #e2dacb;border-radius:10px;background:white;padding:12px}img{max-width:100%;height:230px;object-fit:contain;width:100%}small{display:block}h1{font-size:24px}a{color:#345a85}</style>
<h1>平和台 v0.2：元のSVGをそのまま移植</h1><p>色・線・文字・細部を維持。<a href="../docs/design/towns/heiwadai/img/asset_sheet_1.png">見本1</a> / <a href="../docs/design/towns/heiwadai/img/asset_sheet_2.png">見本2</a> / <a href="../docs/design/towns/heiwadai/img/asset_sheet_3.png">見本3</a> / <a href="../docs/design/towns/heiwadai/img/asset_sheet_4.png">見本4</a></p><main></main>
<script>const WorldArt={};</script><script src="../js/heiwadai-art.js"></script><script src="../js/heiwadai-assets-s.js"></script><script src="../js/heiwadai-assets-ab.js"></script>
<script>
const selected=new URLSearchParams(location.search).get('priority')||'SAB';
for(const a of Object.values(HeiwadaiArt.assets).filter(a=>selected.includes(a.prio))){
  const f=document.createElement('figure'),img=document.createElement('img');img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(HeiwadaiArt.full(a.id));
  const name=document.createElement('strong');name.textContent=a.name;const id=document.createElement('small');id.textContent=a.id+' / '+a.prio;
  f.append(img,name,id);document.querySelector('main').append(f);
}
</script></html>
