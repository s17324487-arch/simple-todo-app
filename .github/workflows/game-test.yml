# ぽかぽかタウン（game/）の自動テスト。
# PR を作ると自動で走り、静的チェック（npm run check）とブラウザでのスモークテスト（13シナリオ）を行う。
# スクリーンショットは Actions の実行結果ページの「Artifacts」→ game-screenshots からダウンロードできる。
name: game-test

on:
  pull_request:
    paths:
      - "game/**"
      - "AGENTS.md"
      - ".github/workflows/game-test.yml"
  push:
    branches: [main]
    paths:
      - "game/**"
      - ".github/workflows/game-test.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: game-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
        shard: [1, 2, 3, 4, 5, 6]
    runs-on: ubuntu-latest
    # シナリオが ふえて 4分割では 1ジョブ 21〜25分に なった（2026-09-30）ので 6分割に。1ジョブ 15分 くらい
    timeout-minutes: 30
    defaults:
      run:
        working-directory: game
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: game/package-lock.json

      - name: 依存を入れる
        run: npm ci

      - name: 静的チェック
        run: npm run check

      - name: ブラウザを入れる
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: スモークテスト（全部・スクリーンショットつき）
        env:
          DEBUG: pw:browser
        run: node tests/smoke.mjs --browser=${{ matrix.browser }} --full --shots --shard=${{ matrix.shard }}/6

      - name: スクリーンショットを保存
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: game-screenshots-${{ matrix.browser }}-${{ matrix.shard }}
          path: game/tests/screenshots/
          if-no-files-found: ignore
          retention-days: 14
