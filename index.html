<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>シンプルTODOアプリ</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <h1>TODOリスト</h1>

    <div id="auth-section">
      <div class="auth-tabs">
        <button type="button" id="tab-login" class="auth-tab active">ログイン</button>
        <button type="button" id="tab-signup" class="auth-tab">新規登録</button>
      </div>
      <form id="auth-form">
        <input type="email" id="auth-email" placeholder="メールアドレス" autocomplete="email" required>
        <input type="password" id="auth-password" placeholder="パスワード(6文字以上)" autocomplete="current-password" minlength="6" required>
        <button type="submit" id="auth-submit">ログイン</button>
      </form>
      <p id="auth-error" class="auth-error"></p>
    </div>

    <div id="app-section" class="hidden">
      <div class="user-bar">
        <span id="user-email"></span>
        <button type="button" id="logout-btn">ログアウト</button>
      </div>
      <form id="todo-form">
        <input type="text" id="todo-input" placeholder="やることを入力..." autocomplete="off" required>
        <button type="submit">追加</button>
      </form>
      <div class="filters">
        <button class="filter-btn active" data-filter="all">すべて</button>
        <button class="filter-btn" data-filter="active">未完了</button>
        <button class="filter-btn" data-filter="done">完了済み</button>
      </div>
      <ul id="todo-list"></ul>
      <div class="footer">
        <span id="remaining-count">0件残り</span>
        <button id="clear-done">完了済みを削除</button>
      </div>
    </div>
  </div>
<script>
  window.addEventListener("error", (e) => {
    const el = document.getElementById("auth-error");
    if (el) el.textContent = "起動エラー: " + (e.message || e);
  });
  window.addEventListener("unhandledrejection", (e) => {
    const el = document.getElementById("auth-error");
    if (el) el.textContent = "起動エラー(Promise): " + (e.reason && e.reason.message ? e.reason.message : e.reason);
  });
</script>
<script type="module" src="script.js"></script>
</body>
</html>
